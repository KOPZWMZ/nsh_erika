[package]
name = "nsh-app-erika-demo"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "0.6"
nsh-base = "0.6"
env_logger = "0.11"

# 本仓库的封装 crate（`examples/player` → `../..`）。
nsh-erika = { path = "../.." }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6", default-features = false }
