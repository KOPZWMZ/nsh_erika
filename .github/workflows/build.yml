name: build

on: [push]

env:
  CARGO_TERM_COLOR: always
  # job 跑在临时目录，target 指到固定位置才有增量编译（第二次开始就快了）
  CARGO_TARGET_DIR: /home/kopdbook/rust_target/cargo

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # erika v0.3.7 的外部消费者缺两个上游前置（补丁版 libass + 仓内 wgpu-hal），
      # 由脚本从 cargo 的 liberika checkout 里取出来放进 gitignore 的 .vendor/。
      - name: 准备 Linux 构建前置
        run: bash scripts/prepare-linux-deps.sh

      - name: 格式检查
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: 编译体检
        run: cargo test --no-run

      - name: 单元测试（毫秒级，硬失败）
        run: cargo test --lib

      - name: 文档测试（硬失败）
        run: cargo test --doc

      # 集成测试的清单在脚本里的 TESTS 数组：加新用例改那一处即可。
      - name: 集成测试（硬失败）
        run: bash scripts/test-integration.sh
