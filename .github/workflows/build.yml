name: build

on: [push]

env:
  CARGO_TERM_COLOR: always
  # job 跑在临时目录，target 指到固定位置才有增量编译（第二次开始就快了）
  CARGO_TARGET_DIR: /home/kopdbook/rust_target/cargo

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 40

    steps:
      - name: 1) 检出代码
        uses: actions/checkout@v4

      - name: 2) 指到本地 liberika
        run: |
          set -e
          LIB=/home/kopdbook/项目/liberika
          test -d "$LIB" || { echo "本地 liberika 不存在: $LIB"; exit 1; }
          mkdir -p .cargo
          printf 'paths = ["%s/crates/erika", "%s/third_party/wgpu-hal"]\n' "$LIB" "$LIB" > .cargo/config.toml
          cat .cargo/config.toml
          cargo tree -i erika 2>/dev/null | head -2 || true

      - name: 3) 格式检查
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: 4) 编译体检（不跑，最快发现编译错误）
        run: cargo test --no-run

      - name: 5) 单元测试（毫秒级，硬失败）
        run: cargo test --lib

      - name: 6) 文档测试（硬失败）
        run: cargo test --doc

      - name: 7) 集成测试 - 状态机（稳定，硬失败）
        run: cargo test --test engine_state

      - name: 8) 集成测试 - open（偶发堆损坏，观察期）
        run: cargo test --test engine_open
        continue-on-error: true
        # TODO 定位 SIGABRT on exit 后去掉

