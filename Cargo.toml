[package]
name = "nsh-erika"
version = "0.1.0"
edition = "2024"
publish = false
description = "erika 播放内核的 NSH 封装：native component `erika.video`"


[dependencies]
# native component 的 `set_prop` / `emit` 用到的 JSON 类型与元素 API。
nsh-core = "0.5.0"
log = "0.4"
serde_json = "1"
actor-lite = "0.1"
crossbeam-channel = "0.5"

# liberika 的播放内核（解码 / 同步 / 字幕 / 弹幕 / 音频）。
# 默认 feature（libass 字幕、内嵌 fallback 字体、ArtCNN）必须留着；
# `default-features = false` 会把 wgpu 渲染后端一起关掉，--features wgpu 是 L2 的前提。
# 注意：本 crate 用到了 v0.3.6 之后的 API（DmabufFrame、export_frame_dmabuf），
# 所以引用自己的 fork 分支，而不是上游的 v0.3.6 tag。
erika = { git = "https://github.com/AimesSoft/liberika", tag = "v0.3.6", features = [
    "wgpu",
] }


[target.'cfg(target_os = "linux")'.dependencies]
# 原生控件宿主：`NativeComponent` / `ComponentContext` / `Components`，并转出 gtk4。
nsh-platform-linux = { version = "0.5.0", default-features = false }
