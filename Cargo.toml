[package]
name = "nsh-erika"
version = "0.1.0"
edition = "2024"
publish = false
description = "erika 播放内核的 NSH 封装：native component `erika.video`"


[dependencies]
# native component 的 `set_prop` / `emit` 用到的 JSON 类型与元素 API。
nsh-core = "0.5.1"
log = "0.4"
serde_json = "1"
actor-lite = "0.1.1"
crossbeam-channel = "0.5"

# liberika 的播放内核（解码 / 同步 / 字幕 / 弹幕 / 音频）。
# 默认 feature（libass 字幕、内嵌 fallback 字体、ArtCNN）必须留着；
# `default-features = false` 会把 wgpu 渲染后端一起关掉，--features wgpu 是 L2 的前提。
# v0.3.7（2026-11-13）起这些改动都进了上游 tag：DmabufFrame / export_frame_dmabuf、
# VA-API 直通（去掉 AV_HWFRAME_MAP_DIRECT），不再需要本地 fork 分支。
# ⚠️ 但 Linux 编译还差两块上游没发出来的东西，见 `.cargo/config.toml` 与 `.vendor/`：
# 打补丁的 wgpu-hal（`set_external_initial_usage`）和补丁版 libass（build.rs 要它）。
erika = { git = "https://github.com/AimesSoft/liberika", tag = "v0.3.7", features = [
    "wgpu",
] }


[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }

[dev-dependencies]
# `tests/frame_output.rs` 用 mmap 读 dma-buf 的像素（dma-buf 不支持 read()）：
# 不做这一步的话，"出帧"只能验到"有个 fd + 尺寸对"，纯黑帧也会过。
libc = "0.2"
[workspace]
members = ["examples/nsh_erika_demo"]
