[package]
name = "nsh-erika"
version = "0.1.0"
edition = "2024"
publish = false
description = "erika 播放内核的 NSH 封装：native component `erika.video`"
license = "MIT OR Apache-2.0"


[dependencies]
# native component 的 `set_prop` / `emit` 用到的 JSON 类型与元素 API。
nsh-core = "0.5.1"
log = "0.4"
serde_json = "1"
actor-lite = "0.1.2"
crossbeam-channel = "0.5"

# liberika 的播放内核（解码 / 同步 / 字幕 / 弹幕 / 音频）。
# 默认 feature（libass 字幕、内嵌 fallback 字体、ArtCNN）必须留着；
# `default-features = false` 会把 wgpu 渲染后端一起关掉，--features wgpu 是 L2 的前提。
# v0.3.7（2026-11-13）起这些改动都进了上游 tag：DmabufFrame / export_frame_dmabuf、
# VA-API 直通（去掉 AV_HWFRAME_MAP_DIRECT），不再需要本地 fork 分支。
#
# Linux 另需两样东西（见文件末尾的 `[patch.crates-io]` 和 `scripts/prepare-linux-deps.sh`）：
#   - 打补丁的 `wgpu-hal`：Vulkan 直接导入要用 `Texture::set_external_initial_usage`；
#   - 补丁版 libass：`erika/build.rs` 断言它存在（系统 libass 缺"有序内存字体回退"）。
erika = { git = "https://github.com/AimesSoft/liberika", tag = "v0.3.7", features = [
    "wgpu",
] }


[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }

[dev-dependencies]
libc = "0.2"
[workspace]
members = ["examples/nsh_erika_demo"]

# Cargo **不会**把依赖仓库里的 `[patch.crates-io]` 传下来 —— 外部消费者必须自己写一份
# （liberika `docs/linux.zh.md`「仓库外的 Cargo workspace」）。Linux 的 Vulkan 直接导入要
# `wgpu-hal` fork 里那个 `initial_usage` 字段，只开 `wgpu` feature 不够。
#
# ⚠️ 这里和上面的 erika **必须同一个 tag**，否则 HAL 和引擎可能来自不同 commit。
# 本地改 wgpu-hal 时才临时换成 `path = "../liberika/third_party/wgpu-hal"`。
#
# 也不用 `[paths]`（`.cargo/config.toml`）覆盖：那是在解析之后硬改源码位置，会带一条
# "path override … has altered the original list of dependencies" 警告，而且配置不入 git，
# 别人 clone 下来编不过。`[patch]` 在解析阶段换源，lock 里记的是真实来源。
[patch.crates-io]
wgpu-hal = { git = "https://github.com/AimesSoft/liberika", tag = "v0.3.7" }
